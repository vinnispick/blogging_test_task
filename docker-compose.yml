version: '3.8'

services:
  app:
    build: .
    container_name: blog_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - blog_network

  db:
    image: mysql:8.0
    container_name: blog_db
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog_network

networks:
  blog_network:
    driver: bridge

volumes:
  mysql_data:
